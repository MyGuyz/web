name: Hello World

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Say hello
        run: echo "สวัสดีจาก GitHub Actions! รันสำเร็จเมื่อ $(date)"

      - name: List files in repo
        run: ls -la
